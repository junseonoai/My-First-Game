<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>한장</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--ground); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .meok { fill:var(--meok); }
  .tile { fill:var(--meok-wash); }
  .ink { fill:var(--card-back); }
  .bubble { fill:var(--card-face); stroke:var(--ink); stroke-width:3; }
  .seal { fill:var(--seal); }
  .call { fill:var(--call); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-weight:700; font-size:120px; line-height:.92; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      meok (먹) 304x264 slab bled off top and right (the ink-wash ground, the largest) · navy card-back card 112x160 (the deck, 청) · hanji speech-bubble card 112x160 tilted -8deg with its tail and an ink outline (the logo silhouette, 백) · seal square 28 on its corner (낙관, 적, the only red) · brass disc r24 once (the shout, 황) · about 40% of 960x288
  arrangement two cards laid on the edge of the ink slab: navy standing on the ground line, the hanji bubble dropped across it onto the meok, one brass pip above, bottoms on y=264 (space-6 above the edge)
  pattern     "a literal motif (card)": 24 deck tiles 16x24 cut by radius-sm-ish 4px corners in meok-wash, staggered at a space-8 pitch and thinning toward the cards, like a dealt deck on the ink
  scales      card sides 112 = space-4 x7, 160 = space-8 x5; slab corner radius-lg 20; card corners radius-md 12; tile pitch space-8, row step 40 (space-8 + space-2)
-->
